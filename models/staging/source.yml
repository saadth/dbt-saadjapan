sources:
  - name: saad_woocommerce_api
    description: This schema contains data from WooCommerce SAADJapan.com using webhook.
    database: saad-intl
    schema: woocommerce_data
    tables:
      - name: raw_woocommerce_orders
        description: >
          Orders recorded by status change.
      - name: refund
        description: >
          refund data.
  - name: saad_woocommerce_polling
    description: This schema contains data from WooCommerce SAADJapan.com using polling.
    database: saad-intl
    schema: raw_woocommerce_v2
    tables:
      - name: orders
        description: >
          Polling orders from 2026-04-21