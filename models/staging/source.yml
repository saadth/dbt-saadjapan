sources:
  - name: saad_woocommerce_api
    description: This schema contains data from WooCommerce SAADJapan.com using webhook.
    database: saad-intl
    schema: woocommerce_data
    tables:
      - name: raw_woocommerce_orders
        description: >
          Orders recorded by status change.
      - name: refund
        description: >
          refund data.
  - name: saad_sns
    description: This schema contains data from SNS.
    database: saad-intl
    schema: saad_sns
    tables:
      - name: ig_saadsilver_intl
        description: >
          IG information
      - name: line_saadsilver_intl
        description: >
          line information
      - name: tiktok_saadsilver_th
        description: >
          tiktok information
      - name: ig_saadsilver_intl_total_followers
        description: >
          IG total followers      
