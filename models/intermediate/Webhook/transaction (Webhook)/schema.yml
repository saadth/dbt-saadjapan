version: 2

models:
  - name: int_extract_fees_and_net
    description: "Extracted fees, net, and discount logic checks for WooCommerce orders"

    columns:
      - name: discount
        description: "Order discount amount"

        tests:
          # Test 1: Discount should not be greater than subtotal
          - dbt_utils.expression_is_true:
              expression: "discount <= subtotal"

      - name: total
        description: "Order total amount"
        tests:
          # Test 2: total ≈ fees + net (rounded to avoid float error)
          - dbt_utils.expression_is_true:
              expression: "round(transaction_fees + transaction_net) = round(total)"

      - name: exchange_rate
        description: "Exchange rate used in calculation"
        tests:
          # Test 3: If currency is THB, exchange_rate must equal 1
          - dbt_utils.expression_is_true:
              expression: "case when lower(currency) = 'thb' then exchange_rate = 1 else true end"
